    <!-- PWA Service Worker Registration -->
    <script>
      // Register service worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('✅ PWA Service Worker registered:', registration.scope);
              
              // Check for updates
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                console.log('🔄 New Service Worker installing...');
                
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('🔄 New content available, please refresh.');
                  }
                });
              });
            })
            .catch(error => {
              console.log('❌ Service Worker registration failed:', error);
            });
        });
      }
      
      // PWA Install Prompt
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        console.log('📱 PWA Install prompt available');
        
        // Show install button after 5 seconds
        setTimeout(() => {
          if (deferredPrompt && !window.matchMedia('(display-mode: standalone)').matches) {
            const installBtn = document.createElement('button');
            installBtn.id = 'pwa-install-btn';
            installBtn.className = 'fixed bottom-6 right-6 z-50 bg-gradient-to-r from-cyan-500 to-blue-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg shadow-cyan-500/30 hover:shadow-[0_0_20px_cyan] transition-all animate-bounce';
            installBtn.innerHTML = '⬇️ Install App';
            installBtn.onclick = installPWA;
            document.body.appendChild(installBtn);
            
            // Auto-hide after 15 seconds
            setTimeout(() => {
              if (installBtn.parentNode) {
                installBtn.remove();
              }
            }, 15000);
          }
        }, 5000);
      });
      
      function installPWA() {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then((choiceResult) => {
            if (choiceResult.outcome === 'accepted') {
              console.log('✅ User accepted PWA install');
              // Remove button after installation
              const installBtn = document.getElementById('pwa-install-btn');
              if (installBtn) installBtn.remove();
            } else {
              console.log('❌ User dismissed PWA install');
            }
            deferredPrompt = null;
          });
        }
      }
      
      // Detect if app is running in standalone mode
      window.addEventListener('DOMContentLoaded', () => {
        if (window.matchMedia('(display-mode: standalone)').matches) {
          console.log('📱 Running in standalone PWA mode');
          document.documentElement.classList.add('pwa-standalone');
        }
      });
    </script>
